<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | My Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-private="true">

<header>
  <a class="brand" href="index.html">HomeClean</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="booking.html">Book</a>
    <a href="my-bookings.html">My Bookings</a>
    <a href="admin.html" data-role-link="admin" hidden>Admin</a>
    <button id="logout-button">Logout</button>
  </nav>
</header>

<main>
  <section class="panel">
    <h1>My Profile</h1>
    <p id="message" class="message" role="status" hidden></p>

    <p><strong>Account type:</strong> <span id="profile-role">Loading...</span></p>
    <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
    <p><strong>Member since:</strong> <span id="profile-created">Loading...</span></p>

    <form id="profile-form">
      <label>Full Name
        <input type="text" name="full_name" maxlength="120" placeholder="Your name">
      </label>
      <button type="submit">Save Name</button>
    </form>
  </section>

  <section class="section-gap">
    <h2>My activity</h2>
    <div id="profile-stats" class="stat-grid"></div>

    <h2>Recent orders</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Service date</th>
            <th>Service</th>
            <th class="num">Total</th>
            <th>Status</th>
            <th>Receipt</th>
          </tr>
        </thead>
        <tbody id="recent-body"></tbody>
      </table>
    </div>
    <p><a class="button" href="my-bookings.html">See all my bookings</a></p>
  </section>
</main>

<footer>HomeClean | Academic Demo</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
