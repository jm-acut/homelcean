<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header>
  <span class="brand">HomeClean</span>
  <nav><a href="signin.html">Sign In</a></nav>
</header>
<main>
  <section class="panel">
    <h1>Create Customer Account</h1>
    <p>Save your details once. We will fill them in every time you book.</p>
    <p id="message" class="message" role="status" hidden></p>
    <form id="signup-form">
      <label>Full Name
        <input type="text" name="fullName" maxlength="120" autocomplete="name" required>
      </label>
      <label>Mobile Number
        <input type="tel" name="phone" placeholder="09171234567" pattern="09[0-9]{9}" maxlength="11" autocomplete="tel" required>
      </label>
      <label>Home Address
        <textarea name="address" rows="2" maxlength="500" autocomplete="street-address" required></textarea>
      </label>
      <div class="location-box">
        <strong>Pin your location (tap the map or drag the pin)</strong>
        <div id="signup-map" class="map" data-map-picker></div>
        <p data-map-status class="muted">No location selected yet.</p>
        <button type="button" data-locate class="secondary">Use my current location</button>
        <input type="hidden" name="latitude">
        <input type="hidden" name="longitude">
      </div>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>Confirm Password
        <input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="signin.html">Sign in</a></p>
  </section>
</main>
<footer>HomeClean | Academic Demo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/gis.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
