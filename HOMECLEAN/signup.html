<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
 <span class="brand">HomeClean</span>
  <nav>
    <a href="signin.html">Sign In</a></nav>
</header>
<main>
  <section class="panel">
    <h1>Create Account</h1>
    <p>Register to submit and view your own demonstration bookings.</p>
    <p id="message" class="message" role="status" hidden></p>
    <form id="signup-form">
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>Confirm Password
        <input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="signin.html">Sign in</a></p>
  </section>
</main>
<footer>HomeClean | Academic Demo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
