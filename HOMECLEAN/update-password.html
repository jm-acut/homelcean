<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Update Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">HomeClean</a>
  <nav><a href="signin.html">Sign In</a></nav>
</header>
<main>
  <section class="panel">
    <h1>Set a New Password</h1>
    <p>Open this page using the authorized recovery link sent to your email.</p>
    <p id="message" class="message" role="status" hidden></p>
    <form id="update-form">
      <label>New Password
        <input type="password" name="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>Confirm New Password
        <input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">Update Password</button>
    </form>
  </section>
</main>
<footer>HomeClean | Academic Demo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
