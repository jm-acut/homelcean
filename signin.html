<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <span class="brand" style="pointer-events:none; cursor:default;">HomeClean</span>
  <nav>
    <a href="signup.html">Sign Up</a>
  </nav>
</header>

<main>
  <section class="panel">
    <h1>Sign In</h1>
    <p id="message" class="message" role="status" hidden></p>
    <form id="signin-form">
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign In</button>
    </form>
    <p><a href="forgot-password.html">Forgot your password?</a></p>
    <p>Need an account? <a href="signup.html">Register here</a></p>
  </section>
</main>

<footer>HomeClean | Academic Demo</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
