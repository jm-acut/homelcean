<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Customer Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-private="true">

<header>
  <a class="brand" href="index.html">HomeClean</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="admin.html" data-role-link="admin" hidden>Admin</a>
    <a href="users.html" data-role-link="admin-only" hidden>Users</a>
    <button id="logout-button">Logout</button>
  </nav>
</header>

<main class="wide">
  <p><a href="users.html">&larr; Back to Users</a></p>
  <h1 id="customer-name">Customer details</h1>
  <p id="customer-info" class="muted"></p>
  <p id="message" class="message" role="status" hidden></p>

  <section id="denied" class="panel" hidden>
    <h2>Admins only</h2>
    <p>This page is only available to admin accounts.</p>
    <p><a class="button" href="index.html">Back to Home</a></p>
  </section>

  <div id="customer-content" hidden>
    <div id="customer-stats" class="stat-grid"></div>

    <h2>Order history</h2>
    <div class="filters">
      <label>Status
        <select id="status-filter">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </label>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Booked on</th>
            <th>Service date</th>
            <th>Service</th>
            <th class="num">Total</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Cleaner</th>
            <th>Rating</th>
            <th>Receipt</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>

    <div class="pager">
      <span id="orders-count" class="muted"></span>
      <button type="button" id="orders-more" class="secondary" hidden>Show more</button>
    </div>
  </div>
</main>

<footer>HomeClean | Academic Demo</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/common.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
