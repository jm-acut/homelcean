<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Password Recovery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">HomeClean</a>
  <nav><a href="signin.html">Sign In</a></nav>
</header>
<main>
  <section class="panel">
    <h1>Forgot Password?</h1>
    <p>Enter your email address to request password recovery instructions.</p>
    <p id="message" class="message" role="status" hidden></p>
    <form id="forgot-form">
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <button type="submit">Send Recovery Email</button>
    </form>
    <p><a href="signin.html">Return to Sign In</a></p>
  </section>
</main>
<footer>HomeClean | Academic Demo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
